<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NIDS System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0F1B2D, #16213e, #0f3460); min-height: 100vh; color: white; }
        .navbar { background: rgba(0,0,0,0.4); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(233,69,96,0.3); }
        .navbar .logo { font-size: 22px; font-weight: bold; color: #E94560; }
        .navbar .logo span { color: white; }
        .nav-links a { color: #C8D8E8; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .nav-links a:hover { color: #E94560; }
        .nav-links .btn-logout { background: rgba(233,69,96,0.2); border: 1px solid #E94560; color: #E94560; padding: 6px 16px; border-radius: 6px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .welcome { margin-bottom: 30px; }
        .welcome h1 { font-size: 28px; font-weight: 700; }
        .welcome h1 span { color: #E94560; }
        .welcome p { color: #8899AA; margin-top: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 25px; text-align: center; }
        .stat-card .stat-icon { font-size: 36px; margin-bottom: 10px; }
        .stat-card h2 { font-size: 36px; font-weight: 800; }
        .stat-card.total h2 { color: #3498db; }
        .stat-card.attacks h2 { color: #E94560; }
        .stat-card.normal h2 { color: #2ecc71; }
        .stat-card p { color: #8899AA; font-size: 13px; margin-top: 5px; }
        .action-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .action-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; text-align: center; text-decoration: none; color: white; transition: transform 0.2s, border-color 0.2s; }
        .action-card:hover { transform: translateY(-3px); border-color: #E94560; }
        .action-card .icon { font-size: 42px; margin-bottom: 15px; }
        .action-card h3 { font-size: 18px; margin-bottom: 8px; color: #E94560; }
        .action-card p { color: #8899AA; font-size: 13px; }
        .recent-section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 25px; }
        .recent-section h2 { font-size: 18px; margin-bottom: 20px; color: #C8D8E8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 15px; font-size: 12px; color: #8899AA; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 12px 15px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #C8D8E8; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-attack { background: rgba(231,76,60,0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .badge-normal { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .empty-state { text-align: center; padding: 40px; color: #8899AA; }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .flash-messages { padding: 10px 40px; }
        .alert { padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        .alert-success { background: rgba(46,204,113,0.2); border: 1px solid #2ecc71; color: #2ecc71; }
        .alert-danger { background: rgba(231,76,60,0.2); border: 1px solid #e74c3c; color: #e74c3c; }
        .alert-info { background: rgba(52,152,219,0.2); border: 1px solid #3498db; color: #3498db; }
        .footer { background: rgba(0,0,0,0.3); padding: 15px; text-align: center; color: #8899AA; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 40px; }
        @media(max-width:768px){ .stats-grid{ grid-template-columns:1fr; } .action-cards{ grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🛡 NIDS <span>System</span></div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('analyse') }}">Analyse</a>
            <a href="{{ url_for('history') }}">History</a>
            <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
        </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <div
